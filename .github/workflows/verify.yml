name: Build and test
on:
  push:
    branches: [integration/galactic-nightmares]
  pull_request:
    branches: [integration/galactic-nightmares]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
